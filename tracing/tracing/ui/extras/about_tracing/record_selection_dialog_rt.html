        <div class="tracing-select">Modes:</div>

      <div class="categories-selection">
        <div class="default-enabled-event-categories">
          <div>Trace&nbsp;Events&nbsp;Categories
              <a class="warning-default-enabled-tracing-categories-hidden">!</a>
          </div>
          <div class="group-selectors">
            Select
            <button class="none-btn">None</button>
          </div>
          <div class="categories"></div>
        </div>
        <div class="default-enabled-function-categories">
          <div>Functions&nbsp;Call&nbsp;Categories
            <a class="warning-default-enabled-function-categories">!</a>
          </div>
          <div class="group-selectors">
            Select
            <button class="none-btn">None</button>
          </div>
          <div class="categories"></div>
        </div>
        <div class="default-enabled-perf-categories">
          <div>Perf&nbsp;Events&nbsp;Categories
            <a class="warning-default-enabled-perf-categories">!</a>

<script>
'use strict';

/**
 * @fileoverview RecordSelectionDialog presents the available categories
 * to be enabled/disabled during tr.c.
 */
tr.exportTo('tr.ui.e.about_tracing', function() {
  const THIS_DOC = document.currentScript.ownerDocument;
  const RecordSelectionDialogRt = tr.ui.b.define('div');
  const categories_ = [];
  const functions_ = [];
  const triggers_ = {};

  function createEditCategorySpan(optionGroupEl, targetEl) {
    const spanEl = tr.ui.b.createSpan({className: 'edit-categories'});
    Polymer.dom(spanEl).textContent = 'Edit categories';
    Polymer.dom(spanEl).classList.add('labeled-option');

    spanEl.addEventListener('click', function() {
      targetEl.onClickEditCategories();
    });
    return spanEl;
  }

  function valuesEqual(a, b) {
    if (a instanceof Array && b instanceof Array) {
      return a.length === b.length && JSON.stringify(a) === JSON.stringify(b);
    }
    return a === b;
  }

  function FindCategoriesPreset(CategoryFilter) {
      // Dedup the categories from regExp 
      // returned when we query the category list.
      const categorySet = [];
      const categoryRELength = CategoryFilter.length;
      if (categoryRELength > 0 && tr.ui.e.about_tracing.categories_ ) {
        const allCategoriesLength = tr.ui.e.about_tracing.categories_.length;
        for (let j = 0; j < categoryRELength; ++j) {
          let categoryCount = 0;
          for (let i = 0; i < allCategoriesLength; ++i) {
            if (CategoryFilter[j].exec(tr.ui.e.about_tracing.categories_[i]))
		      categorySet.push(tr.ui.e.about_tracing.categories_[i]);
          }
        }
      }
      return categorySet;
  }

  function isCategoriesPresetAvailable(CategoryFilter) {
      // Dedup the categories from regExp 
      // returned when we query the category list.
      const categoryCount = 0;
      const categoryRELength = CategoryFilter.length;
      if (categoryRELength > 0 && tr.ui.e.about_tracing.categories_ ) {
        const allCategoriesLength = tr.ui.e.about_tracing.categories_.length;
        for (let j = 0; j < categoryRELength; ++j) {
          let categoryCount = 0;
          for (let i = 0; i < allCategoriesLength; ++i) {
            if (CategoryFilter[j].exec(tr.ui.e.about_tracing.categories_[i]))
            categoryCount++;
          }
          if (categoryCount === 0) return false;
        }
      }
      return true;
  }

  function FindTriggersPreset(CategoryFilter, ActionFilter) {
      // Dedup the Triggers from regExp 
      // returned when we query the Triggers list.
      const triggerSet = [];
      const actionSet = [];
      const triggerRELength = CategoryFilter.length;
      const actionRELength = ActionFilter.length;
      for (let j = 0; j < triggerRELength; ++j) {
          for (const trigger in tr.ui.e.about_tracing.triggers_) {
              if (CategoryFilter[j].exec(trigger)) {
		  triggerSet.push(trigger);
		  let triggerByShortName = trigger.split('/');
		  if ( triggerByShortName.length > 0 ) {
		      triggerByShortName = triggerByShortName[triggerByShortName.length - 1]
		  } else {
		      triggerByShortName = trigger;
		  }
		  for (const action in tr.ui.e.about_tracing.triggers_[trigger]['options']) {
		      for (let i = 0; i < actionRELength; ++i) {
			  if (ActionFilter[i].exec(action)) {
			      actionSet.push(triggerByShortName+'!'+action);
			      break;
			  }
		      }
		      if (actionSet.length>0) break;
		  }
		  if (actionSet.length===0) actionSet.push(triggerByShortName+'!nop');
	      }
	  }
      }
      return [triggerSet.join(','), actionSet.join(';')];
  }

  function FindTriggersByAction(ActionList) {
      // Dedup the Triggers from List 
      // returned when we query the Triggers objects.
      const triggerSet = {};
      const triggerRELength = ActionList.length;
      for (let i = 0; i < triggerRELength; ++i) {
	  const action = ActionList[i].split('!');
	  if (!action.length || action.length > 2 ) continue;
	  const triggerRE = new RegExp(action[0]);
	  const defaultAction = action[1];
          for (const trigger in tr.ui.e.about_tracing.triggers_) {
              if (triggerRE.exec(trigger)) {
		  triggerSet[trigger]=tr.ui.e.about_tracing.triggers_[trigger];
		  triggerSet[trigger]['select'] = triggerSet[trigger]['select'].replace(/!nop/g, '!'+ defaultAction);
	      } else {
		  triggerSet[trigger]=tr.ui.e.about_tracing.triggers_[trigger];
		  triggerSet[trigger]['select'] = triggerSet[trigger]['select'].replace(/-Slt/g, '-hideSlt');
	      }
	  }
      }
      return triggerSet;
  }

  function isTriggersPresetAvailable(CategoryFilter) {
      // Dedup the Triggers from regExp 
      // returned when we query the Triggers list.
      const triggerCount = 0;
      const triggerRELength = CategoryFilter.length;
      if (triggerRELength > 0 && tr.ui.e.about_tracing.triggers_ ) {
        const allTriggersLength = tr.ui.e.about_tracing.triggers_.length;
        for (let j = 0; j < triggerRELength; ++j) {
          let triggerCount = 0;
          for (const trigger in tr.ui.e.about_tracing.triggers_) {
            if (CategoryFilter[j].exec(trigger))
		triggerCount++;
          }
          if (triggerCount === 0) return false;
        }
      }
      return true;
  }
  function createOptionGroup(targetEl, targetElProperty,
      settingsKey, defaultValue, initialMode, initialOption, initialFunction, 
      items) {
    function onChange() {
      let value = [];
      let options = [];
      let functions = [];
      if (this.value.length) {
        value = this.value.split(',');
        //value = this.value;
      }
      if (this.attributes.option.nodeValue != "undefined" ) {
        options = this.attributes.option.nodeValue.split(',');
      }
      if (this.attributes.function.nodeValue != "undefined" ) {
        functions = this.attributes.function.nodeValue.split(',');
      }
      const mode = this.attributes.mode.nodeValue;
      const preset = { 'value': value, 
                       'mode': mode,
                       'options': options,
                       'functions': functions,
                      }
      tr.b.Settings.set(settingsKey, value);
      targetEl[targetElProperty] = preset;
    }

    const optionGroupEl = tr.ui.b.createSpan({className: 'labeled-option-group'});
    const initialValue = FindCategoriesPreset(defaultValue);
    const preset = { 'value': initialValue, 
                      'mode': initialMode,
                      'options': initialOption,
                      'functions': initialFunction,
                    }
    for (let i = 0; i < items.length; ++i) {
      const item = items[i];
      const id = 'category-preset-' + item.label.replace(/ /g, '-');
      const presetValue = FindCategoriesPreset(item.value);

      const radioEl = document.createElement('input');
      radioEl.type = 'radio';
      Polymer.dom(radioEl).setAttribute('id', id);
      Polymer.dom(radioEl).setAttribute('name', 'category-presets-group');
      Polymer.dom(radioEl).setAttribute('value', presetValue);
      Polymer.dom(radioEl).setAttribute('option', item.option);
      Polymer.dom(radioEl).setAttribute('function', item.function);
      Polymer.dom(radioEl).setAttribute('mode', item.mode);

      if (!isCategoriesPresetAvailable(item.value)) {
        // condition to gray-out Radiobutton without a full-match
        radioEl.disabled = true;
        radioEl.checked = false;
      } else {

        radioEl.addEventListener('change', onChange.bind(radioEl, targetEl,
          targetElProperty,
          settingsKey));
      
        if (valuesEqual(initialValue, presetValue)) {
          radioEl.checked = true;
        }

      }

      const labelEl = document.createElement('label');
      Polymer.dom(labelEl).textContent = item.label;
      Polymer.dom(labelEl).setAttribute('for', id);

      const spanEl = tr.ui.b.createSpan({className: 'labeled-option'});
      Polymer.dom(spanEl).appendChild(radioEl);
      Polymer.dom(spanEl).appendChild(labelEl);

      spanEl.__defineSetter__('checked', function(opt_bool) {
        const changed = radioEl.checked !== (!!opt_bool);
        if (!changed) return;

        radioEl.checked = !!opt_bool;
        onChange();
      });
      spanEl.__defineGetter__('checked', function() {
        return radioEl.checked;
      });

      Polymer.dom(optionGroupEl).appendChild(spanEl);
    }
    Polymer.dom(optionGroupEl).appendChild(
        createEditCategorySpan(optionGroupEl, targetEl));
    // Since this option group element is not yet added to the tree,
    // querySelector will fail during updateEditCategoriesStatus_ call.
    // Hence, creating the element with the 'expanded' classlist category
    // added, if last selected value was 'Manual' selection.
    if (!initialValue.length) {
      Polymer.dom(optionGroupEl).classList.add('categories-expanded');
    }
    targetEl[targetElProperty] = preset;
    return optionGroupEl;
  }

  function createOptionGroupTriggers(targetEl, targetElProperty,
	    settingsKey, defaultValue, defaultAction, count, threshold, unit, items) {
    function onChange() {
	let value_ = '';
	let action_ = '';
	let unit_ = 'us';
	let threshold_ = 10;
	let count_ = 100;
	
	if (this.value) {
            value_ = this.value;
	}
	if (this.attributes.action.nodeValue != "undefined" ) {
            action_ = this.attributes.action.nodeValue;
	}
	if (this.attributes.unit.nodeValue != "undefined" ) {
            unit_ = this.attributes.unit.nodeValue;
	}
	if (this.attributes.count.nodeValue != "undefined" ) {
            count_ = this.attributes.count.nodeValue;
	}
	if (this.attributes.threshold.nodeValue != "undefined" ) {
            threshold_ = this.attributes.threshold.nodeValue;
	}
	const preset = { 'value': value_.split(','),
			 'action': action_.split(';'),
			 'count': count_,
			 'threshold': threshold_,
			 'unit': unit_,
                       }

	tr.b.Settings.set(settingsKey, value_);
	targetEl[targetElProperty] = preset;

	const actionList = action_.split(';');
	targetEl.updateTriggerAction_(actionList);
        targetEl.triggerOverlayEl_.visible = true;
    }

    const optionGroupEl = tr.ui.b.createSpan({className: 'triggered-option-group-hidden'});
    const initialValue = FindTriggersPreset(defaultValue, defaultAction);
    const preset = { 'value': initialValue[0].split(','),
                     'action': initialValue[1].split(';'),
                     'count': count,
                     'threshold': threshold,
                     'unit': unit,
                    }

    targetEl.triggerOverlayEl_ = tr.ui.b.Overlay();
    targetEl.triggerOverlayEl_.parentEl_ = targetEl;
    targetEl.triggerOverlayEl_.parentTargetElProperty_ = targetElProperty;
    targetEl.triggerOverlayEl_.title = 'Triggers conditions...';

    targetEl.triggerOverlayEl_.userCanClose = true;
    function onCloseHandler(evt) {
	targetEl.updateCategoriesTrigger_();
    }
    targetEl.triggerOverlayEl_.addEventListener('closeclick', onCloseHandler.bind(targetEl));

    targetEl.setTriggerDialogOverlay_(FindTriggersByAction(initialValue[1].split(';')));

    for (let i = 0; i < items.length; ++i) {
      const item = items[i];
      const id = 'trigger-preset-' + item.label.replace(/ /g, '-').replace(/\(|\)/g, '');
      const presetValue = FindTriggersPreset(item.value, item.action);

      const radioEl = document.createElement('input');
      radioEl.type = 'radio';
      Polymer.dom(radioEl).setAttribute('id', id);
      Polymer.dom(radioEl).setAttribute('name', 'trigger-presets-group');
      Polymer.dom(radioEl).setAttribute('value', presetValue[0]);
      Polymer.dom(radioEl).setAttribute('action', presetValue[1]);
      Polymer.dom(radioEl).setAttribute('count', parseInt(count));
      Polymer.dom(radioEl).setAttribute('threshold', parseInt(threshold));
      Polymer.dom(radioEl).setAttribute('unit', unit);

      if (!isTriggersPresetAvailable(item.value)) {
        // condition to gray-out Radiobutton without a full-match
        radioEl.disabled = true;
        radioEl.checked = false;
      } else {

        radioEl.addEventListener('change', onChange.bind(radioEl, targetEl,
          targetElProperty,
          settingsKey));

        if (valuesEqual(initialValue, presetValue)) {
          radioEl.checked = true;
        }
      }

      const labelEl = document.createElement('label');
      Polymer.dom(labelEl).textContent = item.label;
      Polymer.dom(labelEl).setAttribute('for', id);

      const spanEl = tr.ui.b.createSpan({className: 'labeled-trigger'});
      Polymer.dom(spanEl).appendChild(radioEl);
      Polymer.dom(spanEl).appendChild(labelEl);

      spanEl.__defineSetter__('checked', function(opt_bool) {
        const changed = radioEl.checked !== (!!opt_bool);
        if (!changed) return;

        radioEl.checked = !!opt_bool;
        onChange();
      });
      spanEl.__defineGetter__('checked', function() {
        return radioEl.checked;
      });
      Polymer.dom(optionGroupEl).appendChild(spanEl);
    }

    if (targetEl.traceTriggerCountTxt_ &&
	targetEl.traceTriggerThresholdTxt_ ) {

	const divSyntheticEl = tr.ui.b.createDiv({className : 'synthetic-options'});

	const labelSyntheticCntOptEl = document.createElement('label');
	Polymer.dom(labelSyntheticCntOptEl).textContent = 'trigger-count[0-100]=';
	
	const divSyntheticCntOptEl = tr.ui.b.createDiv({className : 'synthetic-option'});
        Polymer.dom(divSyntheticCntOptEl).appendChild(labelSyntheticCntOptEl);
        Polymer.dom(divSyntheticCntOptEl).appendChild(targetEl.traceTriggerCountTxt_);

	const labelSyntheticThrOptEl = document.createElement('label');
	Polymer.dom(labelSyntheticThrOptEl).textContent = 'trigger-threshold(val[' + unit + '])>';
	
	const divSyntheticThrOptEl = tr.ui.b.createDiv({className : 'synthetic-option'});
        Polymer.dom(divSyntheticThrOptEl).appendChild(labelSyntheticThrOptEl);
        Polymer.dom(divSyntheticThrOptEl).appendChild(targetEl.traceTriggerThresholdTxt_);

	Polymer.dom(divSyntheticEl).appendChild(divSyntheticCntOptEl);
	Polymer.dom(divSyntheticEl).appendChild(divSyntheticThrOptEl);
	
	Polymer.dom(optionGroupEl).appendChild(divSyntheticEl);
    }

    targetEl[targetElProperty] = preset;
    return optionGroupEl;
  }

  function createOptionGroupPerf(targetEl, targetElProperty,
      settingsKey, defaultValue,
      items) {
    function onChange() {
      targetEl[targetElProperty] = this.value;
    }

    const optionGroupEl = document.createElement('div')
    optionGroupEl.className = 'categories'
    const initialValue = defaultValue;
    for (let i = 0; i < items.length; ++i) {

      const id = items[i];
      const value = id.replace(';',',');
      let label = value.split('!')[0].replace('perf-','');

      const perfEvt = perfChkRE.exec(value);
      if (perfEvt[1] != undefined) {
        const label = perfEvt[1];
      }

      const radioEl = document.createElement('input');
      radioEl.type = 'radio';
      Polymer.dom(radioEl).setAttribute('id', id);
      Polymer.dom(radioEl).setAttribute('name', 'perf-events-group');
      Polymer.dom(radioEl).setAttribute('value', value);
      radioEl.addEventListener('change', onChange.bind(radioEl, targetEl,
          targetElProperty,
          settingsKey));
      if (valuesEqual(initialValue, value)) {
        radioEl.checked = true;
      }
      
      if (perfEvt[2] == '-1' ) {
        radioEl.disabled = true;
      }

      const labelEl = document.createElement('label');
      Polymer.dom(labelEl).textContent = label;
      Polymer.dom(labelEl).setAttribute('for', id);

      const spanEl = document.createElement('div')
      Polymer.dom(spanEl).appendChild(radioEl);
      Polymer.dom(spanEl).appendChild(labelEl);

      spanEl.__defineSetter__('checked', function(opt_bool) {
        const changed = radioEl.checked !== (!!opt_bool);
        if (!changed) return;

        radioEl.checked = !!opt_bool;
        onChange();
      });
      spanEl.__defineGetter__('checked', function() {
        return radioEl.checked;
      });

      Polymer.dom(optionGroupEl).appendChild(spanEl);
    } 
    targetEl[targetElProperty] = initialValue;

    return optionGroupEl;
  }

  const allSchedRE = new RegExp('sched\/.*');
  const allClkRE = new RegExp('clk\/.*');
  const allIrqHandlerRE = new RegExp('irq\/(irq|softirq)_.*');

    updateCategoryColumnView_(shouldReadFromSettings) {
      const categorySet = Polymer.dom(this).querySelectorAll('.categories');
      for (let i = 0; i < categorySet.length; ++i) {
        const categoryGroup = categorySet[i].children;
        for (let j = 0; j < categoryGroup.length; ++j) {
          const categoryEl = categoryGroup[j].children[0];
          const category = categoryEl.value;
          if (!category.startsWith('perf-')) {
            const enabledByDefault = !category.startsWith('function-')  ;
            categoryEl.checked = shouldReadFromSettings ?
              tr.b.Settings.get(category, enabledByDefault, this.settings_key_) :
            false;
          }
        }
      }

    updateCategoriesTrigger_() {
	const inputs =
	      Polymer.dom(this.enabledCategoriesContainerEl_).querySelectorAll(
		  'input');
	const hists =
	      Polymer.dom(this.triggerOverlayEl_).querySelectorAll(
		  '.hist-trigger-description');
	for (let i = 0; i < inputs.length; ++i) {
	    const inputEl = inputs[i];
	    for (let j = 0; j < hists.length; ++j) {
		const histEl = hists[j];
		if (histEl.getAttribute('for')  === inputEl.value + '/trigger') {
		    
		    Polymer.dom(inputEl).setAttribute('trigger', histEl.innerText);
		    Polymer.dom(inputEl).setAttribute('triggerOrder', histEl.getAttribute('Order'));
		    
		    const markerEl = Polymer.dom(inputEl.parentNode).querySelector('a')
		    if (histEl.innerText === '') {
			markerEl.className = 'default-enabled-hist-trigger-category-hidden';

			break;

    updatePresetTracingOptions_(o) {
      if (!(o instanceof Array)) {
        throw new Error('categories must be an array');
      }
      this.presets_ = [];
      const values_ = [];
      const ret = []
      for (let i = 0; i < o.length; i++) {
        const split = o[i].split('!');
        this.presets_ = this.presets_.concat(split[0]);
        values_.push(split[1]);
      }
      if (this.usingPreset_() && 
          this.tracingOptionsContainerEl_ != undefined && 
          this.presets_.length > 0 ) {
            let options = Polymer.dom(this.tracingOptionsContainerEl_).querySelectorAll(
                  'input');
            options = options.concat(Polymer.dom(this.tracingOptionsContainerEl_).querySelectorAll(
                  'select'));
            for (let i = 0; i < options.length; ++i) {
              const optionEl = options[i];
              const presetIndex = this.presets_.indexOf(optionEl.name) ;
              if ( presetIndex >= 0 ) {
                if (optionEl.type === 'checkbox')
                  optionEl.checked = values_[presetIndex] > 0 ? true : false; 
                else if (optionEl.type === 'text')
                  optionEl.value = values_[presetIndex];
                else if (optionEl.type === 'select-one')
                  optionEl.selectedValue = values_[presetIndex];
              }
            }
      }
      return ret;
    },


    includedAndOtherCategories() {
      let includedCategories = [];
      let excludedCategories = [];
      let includedFunctionFilters = [];
      let optionsCategories = [];
      let perfCategories = [];
      let triggeredCategories = this.useSnapshots() ? this.enabledByDefaultTriggerCategories_() : [];
      if (this.usingPreset_()) {
        const allCategories = this.allCategories_();
        for (const category in allCategories) {
          const optionsByDefault =
              category.indexOf('option-') === 0;
          const perfByDefault =
              category.indexOf('perf-') === 0;
          if ( !optionsByDefault && !perfByDefault ) {
            if ( this.currentlyChosenPreset_.indexOf(category) >= 0 ) {
                includedCategories.push(category);
            } else {
               excludedCategories.push(category);
            }
          }
        }
        const allFunctions = this.allFunctions_();
        for (const functFilter in allFunctions) {
          if ( this.currentlyChosenFunctionPreset_.indexOf(functFilter) >= 0 ) {
            includedFunctionFilters.push(functFilter);
          }
        }
        return {
          includedEvents: includedCategories,
          excludedEvents: excludedCategories,
          triggeredEvents: triggeredCategories,
          includedFunctions: includedFunctionFilters,
          options: this.enabledByDefaultOptions_(),
          perf: this.enabledByDefaultPerfCategory_()
        };
      }

      includedCategories = this.enabledByDefaultCategories_();
      includedFunctionFilters = this.enabledByDefaultFunctionCategories_();
      return {
        includedEvents: includedCategories,
        excludedEvents: excludedCategories,
        triggeredEvents: triggeredCategories,
        includedFunctions: includedFunctionFilters,
        options: this.enabledByDefaultOptions_(),
        perf: this.enabledByDefaultPerfCategory_()
      };
    },

    collectInputs_(inputs, isChecked) {
      const inputsLength = inputs.length;
      const categories = [];
      for (let i = 0; i < inputsLength; ++i) {
        const input = inputs[i];
        if (input.checked === isChecked) {
          categories.push(input.value);
        }
      }
      return categories;
    },
    
    collectTriggers_(inputs) {

      const inputsLength = inputs.length;
      const categories = [];
      const count = this.traceTriggerCountTxt_ ? this.traceTriggerCountTxt_.value : '100';
      const threshold = this.traceTriggerThresholdTxt_ ? ' if val>' + this.traceTriggerThresholdTxt_.value : '';
      const categoriesOrdered = {
	  '0' : ['synthetic/catapult_snapshot/trigger#snapshot:' + count,
		 'synthetic/catapult_alert/trigger#hist:keys=val,pid:alert=val:sort=val:onmax($alert).snapshot()' + threshold,
		 'synthetic/catapult_start/trigger#traceon:' + count,
		 'synthetic/catapult_stop/trigger#traceoff if (cnt > ' + count + ')'] };
      for (let i = 0; i < inputsLength; ++i) {
        const input = inputs[i];
        if (input.checked === true &&
	    input.getAttribute('trigger') !== '') {
            const order = parseInt(input.getAttribute('triggerOrder'));
	    if (categoriesOrdered[order] === undefined)
		categoriesOrdered[order] = [];
            categoriesOrdered[order].push(input.value + '/trigger#' + input.getAttribute('trigger'));
        }
      }
      for (const [key, values] in categoriesOrdered) {
	  for (let i = 0; i < categoriesOrdered[key].length; ++i)
	      categories.push(categoriesOrdered[key][i]);
      }
      return categories;
    },
    
    collectOptions_(options) {
      const optionsLength = options.length;
      const ret = [];
      for (let i = 0; i < optionsLength; ++i) {
        const option = options[i];
        if (option.type === 'checkbox')
          ret.push(option.id + '!' + (option.checked ? 1 : 0) );
        else if (option.type === 'text')
          ret.push(option.id + '!' + option.value);
        else if (option.type === 'select-one')
          ret.push(option.id + '!' + option.value);
      }
      return ret;
    },

    unselectedCategories_() {
      const inputs =
          Polymer.dom(this.enabledCategoriesContainerEl_).querySelectorAll(
              'input');
      return this.collectInputs_(inputs, false);

    enabledByDefaultCategories_() {

          Polymer.dom(this.enabledCategoriesContainerEl_).querySelectorAll(

      return this.collectTriggers_(inputs);

    buildInputs_(inputs, checkedDefault, parent) {
      const inputsLength = inputs.length;
      for (let i = 0; i < inputsLength; i++) {
        const category = inputs[i];
        const inputEl = document.createElement('input');
        const triggerEl = document.createElement('a');
        let categoryShortName = 'None';
        let categoryLabel = 'None';

        categoryLabel = category;
        categoryShortName = category.replace('/', '-');
        inputEl.type = 'checkbox';
        inputEl.id = categoryShortName;
        inputEl.value = category;
        if (parent.disabled) {
          inputEl.disabled = true;
        } else {
          inputEl.checked = tr.b.Settings.get(
          category, checkedDefault, this.settings_key_);
          inputEl.onclick = this.updateSetting_.bind(this);
          Polymer.dom(inputEl).setAttribute('trigger', '');

	  Polymer.dom(triggerEl).setAttribute('class', 'default-enabled-hist-trigger-category-hidden');
	  Polymer.dom(triggerEl).textContent = 't';
          Polymer.dom(triggerEl).setAttribute('for', category + '/trigger');
        }
        const labelEl = document.createElement('label');
        Polymer.dom(labelEl).textContent = categoryLabel;
        Polymer.dom(labelEl).setAttribute('for', categoryShortName);

        const divEl = document.createElement('div');
        Polymer.dom(divEl).appendChild(inputEl);
        Polymer.dom(divEl).appendChild(labelEl);
	Polymer.dom(divEl).appendChild(triggerEl);
        Polymer.dom(parent).appendChild(divEl);
      }

          const optionIsDef = parseInt(option[3]) == -1 ? undefined  : optionsByDefault;

    updateForm_() {
      function ignoreCaseCompare(a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
      }

      // Clear old categories
      Polymer.dom(this.enabledCategoriesContainerEl_).innerHTML = '';
      Polymer.dom(this.perfCategoriesContainerEl_).innerHTML = '';
      Polymer.dom(this.functionCategoriesContainerEl_).innerHTML = '';
      Polymer.dom(this.tracingOptionsContainerEl_).innerHTML = ''

      this.recordButtonEl_.focus();

      const allCategories = this.allCategories_();
      let categories = [];
      let optionsCategories = [];
      let functionCategories = [];
      let perfCategories = [];
      for (const category in allCategories) {
        if (category.indexOf('option-') === 0) {
          optionsCategories.push(category);
        } else if (category.indexOf('perf-') === 0) {
          perfCategories.push(category);
        } else {
          categories.push(category);
        }
      }
      for (const functFilter in this.allFunctions_()) {
        functionCategories.push(functFilter);
      }
      optionsCategories = optionsCategories.sort(ignoreCaseCompare);
      functionCategories = functionCategories.sort(ignoreCaseCompare);
      perfCategories = perfCategories.sort(ignoreCaseCompare);
      categories = categories.sort(ignoreCaseCompare);

      if (tr.ui.e.about_tracing.categories_.length === 0) {
        this.infoBarGroup_.addMessage(
            'No categories found; chech that Linux .config contains CONFIG_TRACING=y, CONFIG_EVENT_TRACING=y, CONFIG_TRACER_SNAPSHOT=y, CONFIG_HIST_TRIGGERS=y and CONFIG_DYNAMIC_FTRACE=y');
      }

      this.buildInputs_(categories, true, this.enabledCategoriesContainerEl_);

      if (optionsCategories.length > 0) {
        this.tracingOptionsContainerEl_.hidden = false;
        this.buildOptions_(this,'recordSelectionDialogRt',
			   this.tracingOptionsContainerEl_,optionsCategories);
      }

      if (functionCategories.length > 0) {
        this.functionCategoriesContainerEl_.hidden = false;
        this.functionCategoriesContainerEl_.disabled = this.funcgraph_flat == undefined ?  true : !this.funcgraph_flat;
        this.buildInputs_(functionCategories, false,
            this.functionCategoriesContainerEl_);
      }

      if (perfCategories.length > 0) {
        perfCategories = ['perf-None!x'].concat(perfCategories);
        const perfCategoriesNewContainerEl_ = createOptionGroupPerf(
          this, 'perfRecord', 
          'about_tracing.record_selection_dialog_preset',
          'perf-None!x',
          perfCategories)
        const perfCategoriesContainerParentEl_ =
          Polymer.dom(this).querySelector(
              '.default-enabled-perf-categories');
        Polymer.dom(perfCategoriesContainerParentEl_).removeChild(this.perfCategoriesContainerEl_);
        Polymer.dom(perfCategoriesContainerParentEl_).appendChild(perfCategoriesNewContainerEl_);
        this.perfCategoriesContainerEl_.hidden = false;
      }
    },

    updateTriggerAction_(o) {

	if (this.triggerOverlayEl_ === undefined) return;

	if (!(o instanceof Array)) {
            throw new Error('categories must be an array');
	}

	this.triggerPresets_ = [];
	const values_ = [];
	const select_group = [];
	for (let i = 0; i < o.length; i++) {
            const split = o[i].split('!');
            this.triggerPresets_ = this.triggerPresets_.concat(split[0]);
            values_.push(split[1]);
	}

	let triggerSelect = Polymer.dom(this.triggerOverlayEl_).querySelectorAll('.trigger');
	triggerSelect = triggerSelect.concat(Polymer.dom(this.triggerOverlayEl_).querySelectorAll('.trigger-hidden'));
	let triggerLabels = Polymer.dom(this.triggerOverlayEl_).querySelectorAll('.trigger-id');
	triggerLabels = triggerLabels.concat(Polymer.dom(this.triggerOverlayEl_).querySelectorAll('.trigger-id-hidden'));
	for (let j = 0; j < triggerSelect.length; ++j) {
	    
	    const triggerEl = triggerSelect[j];
	    const triggerLabelEl = triggerLabels[j];
	    
	    if (triggerEl.type !== 'select-one') continue;
	    
	    if (this.usingTriggerPreset_() && 
		this.triggerPresets_.length > 0 ) {

		const presetIndex = this.triggerPresets_.indexOf(triggerEl.name);
		if ( presetIndex >= 0 ) {
		    triggerEl.selectedValue = values_[presetIndex];
		    Polymer.dom(triggerLabelEl).classList.remove('trigger-id-hidden');
		    Polymer.dom(triggerEl).classList.remove('trigger-hidden');
		    Polymer.dom(triggerLabelEl).classList.add('trigger-id');
		    Polymer.dom(triggerEl).classList.add('trigger');
		} else {
		    triggerEl.selectedValue = 'nop';
		    Polymer.dom(triggerLabelEl).classList.remove('trigger-id');
		    Polymer.dom(triggerEl).classList.remove('trigger');
		    Polymer.dom(triggerLabelEl).classList.add('trigger-id-hidden');
		    Polymer.dom(triggerEl).classList.add('trigger-hidden');
		}
		
	    }
	    select_group.push(triggerEl.selectedValue);
	}

	if (select_group.length) {

	    const options = Polymer.dom(this.triggerOverlayEl_).querySelectorAll(
		      '.trigger-options');
	    for (let j = 0; j < options.length; ++j) {

		const optionEl = options[j];
		let actions = Polymer.dom(optionEl).querySelectorAll('.action');
		actions = actions.concat(Polymer.dom(optionEl).querySelectorAll('.action-hidden'));

		for (let k = 0; k < actions.length; ++k) {

		    const actionEl = actions[k];
		    const description = Polymer.dom(actionEl).querySelector(
			'.hist-trigger-description');
		    if ( select_group.indexOf(actionEl.getAttribute('action')) >= 0 &&
			 actionEl.getAttribute('action') !== 'nop') {

			description.innerText =
			    'hist:keys=' + actionEl.getAttribute('keys') +
			    ':' + actionEl.getAttribute('vars') +
			    ':size=' + actionEl.getAttribute('size') + 
			    ':' + actionEl.getAttribute('action');

			// Explore action filters
			const filters = Polymer.dom(actionEl).querySelectorAll('.filter');
			let filterStr_ = '';
			let fieldCnt = 0;
			for (let l = 0; l < filters.length; ++l) {
			    const filterEl = filters[l];
			    if (filterEl.value !== '') {
				let field_ = '';
				if (filterEl.getAttribute('type') === 'txt')
				    field_ = filterEl.name + '"' + filterEl.value + '"';
				else if (filterEl.getAttribute('type') === 'na')
				    field_ = filterEl.name;
				else
				    field_ = filterEl.name + filterEl.value;
	
				if (!fieldCnt)
				    filterStr_ += field_;
				else
				    filterStr_ += ') && (' + field_ ;
				fieldCnt++;
			    }
			}

			if ( filterStr_ !== '')
			    description.innerText += ' if (' + filterStr_ + ')';
			description.innerText += '\n'

			// unveil action user options
			actionEl.className = 'action';

			if (actionEl.getAttribute('depends') === '') continue;

			// Explore action inter-dependencies
			const actionsDepends = actionEl.getAttribute('depends').split(':');
			for (let m = 0; m < actionsDepends.length; ++m) {

			    const depend = actionsDepends[m].split('#');

			    // search depending actions across all event triggers
			    let actionDependEl = undefined;
			    for (let i = 0; i < options.length && actionDependEl === undefined; ++j) {

				const optionDependEl = options[i];
				let allActions = Polymer.dom(optionDependEl).querySelectorAll('.action');
				allActions = allActions.concat(Polymer.dom(optionDependEl).querySelectorAll('.action-hidden'));

				for (let n = 0; n < allActions.length; ++n) {
				    if ((allActions[n].getAttribute('for') ===  depend[0] + '/trigger') &&
					allActions[n].getAttribute('action') ===  depend[1]) {
					actionDependEl = allActions[n];
					break;
				    }
				}
			    }

			    if (actionDependEl !== undefined) {
				const dependDescription = Polymer.dom(actionDependEl).querySelector(
				    '.hist-trigger-description');
				dependDescription.innerText += 'hist:keys=' + actionDependEl.getAttribute('keys') +
				    ':' + actionDependEl.getAttribute('vars') +
				    ':size=' + actionDependEl.getAttribute('size') + 
				    ':' + actionDependEl.getAttribute('action')

				const dependFilters = Polymer.dom(actionDependEl).querySelectorAll('.filter');
				let dependFilterStr_ = '';
				let dependFieldCnt = 0;
				for (let o = 0; o < dependFilters.length; ++o) {
				    const dependfilterEl = dependFilters[o];
				    const filterEl = filters[o];
				    if (filterEl.value !== '') {
					let dependsField_ = '';
					if (dependfilterEl.getAttribute('type') === 'txt')
					    dependsField_ = dependfilterEl.name + '"' + filterEl.value + '"';
					else if (dependfilterEl.getAttribute('type') === 'na')
					    dependsField_ = dependfilterEl.name;
					else
					    dependsField_ = dependfilterEl.name + filterEl.value;

					if (!dependFieldCnt)
					    dependFilterStr_ += dependsField_;
					else
					    dependFilterStr_ += ') && (' + dependsField_ ;
					dependFieldCnt++;
				    }
				}

				if ( dependFilterStr_ !== '')
				    dependDescription.innerText += ' if (' + dependFilterStr_ + ')';
				dependDescription.innerText += '\n';
				//actionDependEl.className = 'action';
			    }
			}
		    } else {
			description.innerText = ''
			actionEl.className = 'action-hidden';
		    }
		}
	    }
	}
    },
      
    setTriggerDialogOverlay_(selects) {

	if (!(selects instanceof Object)) {
            throw new Error('Trigger selection must be an dict');
	}

	if (!this.triggerOverlayEl_) return;
	const contentDiv = tr.ui.b.createDiv({className: 'triggers'});
	for (sel in selects) {

	  if (!('select' in selects[sel])) continue;

	  const select = selects[sel];
	  const option = optionSltRE.exec(select['select']);
	  
	  const selectClass = (option[1] === 'hideSlt') ? 'trigger-hidden'  : 'trigger';
          const labelClass = (option[1] === 'hideSlt') ? 'trigger-id-hidden'  : 'trigger-id';
	  const optionsByName = option[2];
	  let optionsByShortName = option[2].split('/');
	  if ( optionsByShortName.length > 0 ) {
              optionsByShortName = optionsByShortName[optionsByShortName.length - 1]
	  } else {
              optionsByShortName = optionsByName;
	  }
	  const optionsBySelect = option[3].split(':');
	  const optionsByDefault = option[4];

	  const items = [];
	  const targetElPropertyTrigger = optionsByShortName.replace('-','_') + '.trigger';
	  const settingsKey = this.triggerOverlayEl_.parentTargetElProperty_ + '.' + targetElPropertyTrigger;
	  const optionId = optionsByName + '/trigger';

	  if (optionsBySelect.length) {

	      const triggerClass = 'trigger-options'; //'trigger-options-hidden';
	      const ContainerTriggersEl = tr.ui.b.createDiv({className : triggerClass});
	      Polymer.dom(ContainerTriggersEl).textContent = '';
	      Polymer.dom(ContainerTriggersEl).setAttribute('for', optionId);

              for (let j = 0; j < optionsBySelect.length; j++) {
		  const handler = optionsBySelect[j];
		  if (handler === optionsByDefault ) {
		      defaultValueIndex =j; 
		  }

		  items.push( { 'label': handler,
				'value': handler} );

		  if (!('options' in select)) continue;

		  const options = select['options'];

		  if (handler in options) {

		      if ('if' in options[handler]) {

			  const actionClass =  'action-hidden' ; //'action';
			  const actionId = optionId + '/' + handler;
			  const actionEl = tr.ui.b.createDiv({className : actionClass});
			  const actionDepends = options[handler]['depends'].join(':');
			  Polymer.dom(actionEl).setAttribute('for', optionId);
			  Polymer.dom(actionEl).setAttribute('keys', options[handler]['keys']);
			  Polymer.dom(actionEl).setAttribute('vars', options[handler]['vars']);
			  Polymer.dom(actionEl).setAttribute('size', options[handler]['size']);
			  Polymer.dom(actionEl).setAttribute('depends', actionDepends);
			  Polymer.dom(actionEl).setAttribute('action', handler);

			  const description = tr.ui.b.createDiv({className : 'hist-trigger-description'});
			  description.innerText = ''
			  Polymer.dom(description).setAttribute('order', options[handler]['depends'].length);
			  Polymer.dom(description).setAttribute('for', optionId);
			  Polymer.dom(actionEl).appendChild(description);

			  const targetElPropertyAction =  '.action.' + handler.replace('-','_');
			  const filterObjets = Object.entries(options[handler]['if']);
			  const divFilterGroupEl = tr.ui.b.createDiv({className : 'filters'});
			  for (let k = 0; k < filterObjets.length; k++) {
			      
			      const filter = filterObjets[k];
			      const filterClass = 'filter'; //'filter-hidden';
			      const filterByName = filter[0].replace(/[<>=]+/,'');
			      const filterValueType = filter[1];
			      const filterId = actionId + '/' + filterByName;
			      const targetElProperty =  '.filter.' + filterByName.replace('-','_');
			      const settingsKey = targetElPropertyTrigger + targetElPropertyAction + targetElProperty;

			      const labelFilterEl = document.createElement('label');
			      Polymer.dom(labelFilterEl).textContent = '('+ filter[0] + '...)';
			      Polymer.dom(labelFilterEl).setAttribute('for', filterId );

			      const optionTxtEl = tr.ui.b.createTextInput(
				  this.triggerOverlayEl_, targetElProperty,
				  settingsKey,
				  '');
			      optionTxtEl.id = filterId;
			      optionTxtEl.name = filter[0];
			      optionTxtEl.className = filterClass;

			      function onActionEdit() {
				  this.updateTriggerAction_([optionsByShortName + '!' + handler]);
			      }
			      optionTxtEl.onmouseleave = onActionEdit.bind(this, optionsByShortName, handler);
			      Polymer.dom(optionTxtEl).setAttribute('type', filterValueType );

			      const divFilterEl = tr.ui.b.createDiv();
			      Polymer.dom(divFilterEl).textContent = (k === 0) ? 'IF ' : ' && ';
			      Polymer.dom(divFilterEl).setAttribute('for', actionId );
			      Polymer.dom(divFilterEl).appendChild(labelFilterEl);
			      Polymer.dom(divFilterEl).appendChild(optionTxtEl);
			      Polymer.dom(divFilterGroupEl).appendChild(divFilterEl);
			  }
			  Polymer.dom(actionEl).appendChild(divFilterGroupEl);
			  Polymer.dom(ContainerTriggersEl).appendChild(actionEl);
		      }
		  }
              }

              const labelEl = document.createElement('label');
              labelEl.className = labelClass;
              Polymer.dom(labelEl).textContent = optionId;
              Polymer.dom(labelEl).setAttribute('for', optionsByShortName);

              const optionSltEl = tr.ui.b.createSelector(
		  this.triggerOverlayEl_, targetElPropertyTrigger,
		  settingsKey,
		  optionsByDefault, items);
              optionSltEl.id = optionId;
              optionSltEl.name = optionsByShortName;
              optionSltEl.className = selectClass;
	      function onActionChange() {
		  this.updateTriggerAction_([]);
	      }
	      optionSltEl.onchange = onActionChange.bind(this);

	      const divSelEl = tr.ui.b.createDiv();
              Polymer.dom(divSelEl).appendChild(labelEl);
              Polymer.dom(divSelEl).appendChild(optionSltEl);
              Polymer.dom(contentDiv).appendChild(divSelEl);
              Polymer.dom(contentDiv).appendChild(ContainerTriggersEl);
	  }
	}
	Polymer.dom(this.triggerOverlayEl_).textContent = '';
	Polymer.dom(this.triggerOverlayEl_).appendChild(contentDiv);
    }
  };

  return {
    RecordSelectionDialogRt,
    _RecordSelectionDialogRtTestExports: TestExports

  };
});
</script>
